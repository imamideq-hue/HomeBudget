name: Build Android APK

# Produces a standalone, installable APK as a downloadable artifact.
# No Expo account needed — the release build is signed with the generated
# debug keystore (fine for testing / sideloading).

# Manual only — run from the Actions tab (or on request) so day-to-day pushes
# don't trigger a ~28-min build.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Raise Gradle JVM memory (avoid Metaspace OOM)
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.daemon=false"
            echo "org.gradle.workers.max=2"
          } >> android/gradle.properties

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeBudget-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
