name: Build Android APK

# Produces a standalone, installable APK as a downloadable artifact.
# No Expo account needed — the release build is signed with the generated
# debug keystore (fine for testing / sideloading).

on:
  workflow_dispatch:
  push:
    branches: [claude/budget-app-setup-kgdytu]
    paths-ignore:
      - '**.md'
      - '.github/workflows/deploy-pages.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: '1'

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeBudget-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
